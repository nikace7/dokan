[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dokan-backend"
version = "0.1.0"
description = "Multi-tenant SaaS for clothing retail shops in Nepal — Django backend."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "Django>=5.0,<7.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "celery>=5.4",
    "nepali-datetime>=1.0.7",
    "drf-spectacular>=0.27",
    "Pillow>=10.4",
    "openpyxl>=3.1,<4",
    "prometheus-client>=0.22,<1",
    "sentry-sdk[django]>=2.35,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.16,<0.17",
    "mypy>=2.1,<2.5",
    "django-stubs[compatible-mypy]>=6.0,<6.2",
    "djangorestframework-stubs[compatible-mypy]>=3.17,<3.19",
    "types-openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "apps*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.format]
# Deployed Django migrations are immutable; formatting must never rewrite them.
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
# RUF001/2/3 flag "ambiguous" unicode; Devanagari numerals and §/— in
# docstrings are intentional in this codebase (Nepali-first product).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "RUF012"]  # asserts and DRF class-attribute idiom are fine in tests
"**/migrations/**" = ["RUF012"]  # migrations use list class attributes by design
"**/models.py" = ["RUF012"]  # Django Meta constraints/indexes are class-level lists
"scripts/**" = ["T201"]

# ---------------------------------------------------------------------------
# mypy (django-stubs). Strict-ish: full annotations required on new code.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "."
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_reexport = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["*.migrations.*", "nepali_datetime.*", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["config.settings.*"]
# Settings modules are star-import chains; do not require annotations there.
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["*.tests.*", "tests.*", "conftest"]
# Factories type as their factory class (not the model) and DRF's APIClient
# kwargs stubs don't match runtime behavior; tests keep runtime checks.
disable_error_code = ["attr-defined", "arg-type", "misc", "assignment", "union-attr"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["core", "apps"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

# ---------------------------------------------------------------------------
# Coverage.
# Floor: 80% overall (enforced in CI via --fail-under=80).
# REQUIRED: 100% line and branch coverage on apps/pricing, apps/sales/services,
# the inventory write modules, and core/calendar. CI enforces the exact boundary
# with scripts/check_critical_coverage.py because a bug there costs the shop money.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["config", "core", "apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "*/asgi.py",
    "*/wsgi.py",
    # Environment-specific wiring, exercised by deploys, not unit tests.
    "config/settings/dev.py",
    "config/settings/prod.py",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
