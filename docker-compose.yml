# Phase-1 single-VPS topology (docs/SYSTEM_DESIGN.md §8.8):
# Caddy → Gunicorn (web) + Celery (worker/beat) + Postgres 16 + Redis 7.

x-backup-image: &backup-image
  image: dokan-backup
  build:
    context: docker/backup

services:
  wal-init:
    image: postgres:16
    user: root
    command: ["sh", "-c", "chown postgres:postgres /wal-archive && chmod 0700 /wal-archive"]
    volumes:
      - walarchive:/wal-archive

  monitoring-init:
    image: postgres:16
    profiles: [production, ops, monitoring]
    user: root
    command: ["sh", "-c", "chown postgres:postgres /monitoring && chmod 0755 /monitoring"]
    volumes:
      - monitoringdata:/monitoring

  db:
    image: postgres:16
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - archive_mode=${POSTGRES_ARCHIVE_MODE:-off}
      - -c
      - "archive_command=test -f /wal-archive/%f || (cp %p /wal-archive/%f.tmp && mv /wal-archive/%f.tmp /wal-archive/%f)"
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT_SECONDS:-300}s
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-dokan}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DOKAN_APP_PASSWORD: ${DOKAN_APP_PASSWORD:?Set DOKAN_APP_PASSWORD in .env}
      DOKAN_MIGRATOR_PASSWORD: ${DOKAN_MIGRATOR_PASSWORD:?Set DOKAN_MIGRATOR_PASSWORD in .env}
      DOKAN_MONITOR_PASSWORD: ${DOKAN_MONITOR_PASSWORD:-change-me-monitor-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal-archive
      # Creates the app (non-superuser, non-owner) and migration roles.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      wal-init:
        condition: service_completed_successfully

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Local frontend/dev access only; public traffic must enter through Caddy.
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      # Uploaded media (item images) lives on the shared ``media`` volume;
      # Caddy serves it read-only at /media/* (mirrors the static pattern).
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
    labels:
      dokan.logs.safe: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8000/api/health',
          headers={'Host':'app.'+os.environ['ROOT_DOMAIN']});
          urllib.request.urlopen(r,timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery:
    build: .
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

  backup:
    <<: *backup-image
    profiles: [production]
    restart: unless-stopped
    command: backup-loop.sh
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${DATABASE_NAME:-dokan}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BASE_BACKUP_ENABLED: ${BASE_BACKUP_ENABLED:-true}
      BASE_BACKUP_INTERVAL_DAYS: ${BASE_BACKUP_INTERVAL_DAYS:-7}
      BASE_BACKUP_RETENTION_DAYS: ${BASE_BACKUP_RETENTION_DAYS:-35}
      REQUIRE_OBJECT_STORAGE: ${REQUIRE_OBJECT_STORAGE:-true}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      MONITORING_TEXTFILE_DIR: /monitoring
    volumes:
      - backups:/backups
      - monitoringdata:/monitoring
    depends_on:
      db:
        condition: service_healthy
      monitoring-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "backup-healthcheck.sh"]
      interval: 5m
      timeout: 2m
      retries: 3
      start_period: 15m

  wal-uploader:
    <<: *backup-image
    profiles: [production]
    restart: unless-stopped
    command: wal-upload-loop.sh
    environment:
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      WAL_UPLOAD_INTERVAL_SECONDS: ${WAL_UPLOAD_INTERVAL_SECONDS:-60}
      WAL_LOCAL_RETENTION_DAYS: ${WAL_LOCAL_RETENTION_DAYS:-2}
      MONITORING_TEXTFILE_DIR: /monitoring
    volumes:
      - walarchive:/wal-archive
      - monitoringdata:/monitoring
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wal-healthcheck.sh"]
      interval: 1m
      timeout: 30s
      retries: 3
      start_period: 5m

  restore-drill:
    <<: *backup-image
    profiles: [ops]
    command: restore-drill.sh
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${DATABASE_NAME:-dokan}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RESTORE_DATABASE: ${RESTORE_DATABASE:-dokan_restore_drill}
      MONITORING_TEXTFILE_DIR: /monitoring
    volumes:
      - backups:/backups
      - monitoringdata:/monitoring
    depends_on:
      db:
        condition: service_healthy
      monitoring-init:
        condition: service_completed_successfully

  frontend:
    image: dokan-frontend
    build:
      context: frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  storefront:
    image: dokan-storefront
    build:
      context: storefront
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: dokan-caddy
    build:
      context: docker/caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - staticfiles:/srv/django-static:ro
      - media:/srv/django-media:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
      celery-exporter:
        condition: service_started

  grafana:
    image: grafana/grafana:13.1.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.7.2
    profiles: [monitoring]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./docker/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki

  alloy:
    image: grafana/alloy:v1.18.0
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/monitoring/alloy.config:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      - loki

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${DATABASE_NAME:-dokan}?sslmode=disable
      DATA_SOURCE_USER: dokan_monitor
      DATA_SOURCE_PASS: ${DOKAN_MONITOR_PASSWORD:-change-me-monitor-password}
    depends_on:
      db:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.77.0-alpine
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  celery-exporter:
    image: danihodovic/celery-exporter:0.10.4
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      CE_BROKER_URL: redis://redis:6379/1
      CE_RETRY_INTERVAL: "5"
    depends_on:
      - celery

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/monitoring
    volumes:
      - /:/host:ro,rslave
      - monitoringdata:/monitoring:ro
    depends_on:
      monitoring-init:
        condition: service_completed_successfully

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.57.0
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.3
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptimedata:/app/data

volumes:
  pgdata:
  walarchive:
  backups:
  redisdata:
  staticfiles:
  media:
  caddydata:
  caddyconfig:
  prometheusdata:
  grafanadata:
  uptimedata:
  monitoringdata:
  lokidata:
  alloydata:
