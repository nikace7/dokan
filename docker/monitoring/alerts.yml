groups:
  - name: dokan-application
    rules:
      - alert: DokanHighHttpErrorRate
        expr: |
          sum(rate(dokan_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(dokan_http_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Dokan HTTP 5xx rate is above 1%"

      - alert: DokanSalesLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(dokan_http_request_duration_seconds_bucket{
              route=~"sales:sale-list|sales:sale-complete"
            }[5m]))) > 1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Sales completion p95 latency is above one second"

      - alert: DokanCeleryWorkerMissing
        expr: sum(celery_worker_up) < 1 or absent(celery_worker_up)
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No Celery worker is reporting healthy"

      - alert: DokanCeleryQueueBacklog
        expr: sum(celery_queue_length) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Celery queue has more than 100 waiting tasks"

  - name: dokan-infrastructure
    rules:
      - alert: DokanTargetDown
        expr: up{job=~"dokan-backend|postgres|redis|celery|node|containers"} == 0
        for: 3m
        labels:
          severity: page
        annotations:
          summary: "A Dokan monitoring target is down"

      - alert: DokanHostDiskLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.20
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Host filesystem has less than 20% free space"

      - alert: DokanRedisMemoryHigh
        expr: redis_memory_max_bytes > 0 and redis_memory_used_bytes / redis_memory_max_bytes > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is above 80%"
