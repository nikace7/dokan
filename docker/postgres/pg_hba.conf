# Local socket access is confined to the database container.
local   all             all                                     trust

# All cross-container connections require password authentication. Roles still
# enforce application-vs-migration privileges and PostgreSQL RLS.
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256

# pg_basebackup uses the replication protocol. Only roles carrying PostgreSQL's
# REPLICATION attribute can pass this rule; the app and migrator roles do not.
host    replication     all             0.0.0.0/0               scram-sha-256
host    replication     all             ::/0                    scram-sha-256
