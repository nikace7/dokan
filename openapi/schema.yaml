components:
  schemas:
    Accepted:
      type: object
      properties:
        accepted:
          type: boolean
      required:
      - accepted
    Adjustment:
      type: object
      description: POST /inventory/adjustments payload.
      properties:
        branch:
          type: string
          format: uuid
        variant:
          type: string
          format: uuid
        qty_delta:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        reason:
          type: string
          maxLength: 500
      required:
      - branch
      - qty_delta
      - reason
      - variant
    AllocationInput:
      type: object
      description: One allocation of a receipt/payment against a specific invoice.
      properties:
        invoice:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - amount
      - invoice
